<title>Santa Works ヒーロー最終案</title>

<style>
  /* santaworks.net リニューアル：ヒーロー最終デザイン案（F「つくったものの壁」）
     ライト固定（2026-08-15決定）。色は app/globals.css のトークン＋業種パレット。 */
  :root {
    --bg: #fbfbf8;
    --fg: #24262e;
    --muted: #474d5b;
    --accent: #c4333e;
    --accent-strong: #a2242f;
    --accent-soft: rgba(196, 51, 62, 0.08);
    --hairline: rgba(36, 38, 46, 0.12);
    --card-shadow: 0 12px 40px rgba(36, 38, 46, 0.07);
  }

  * { box-sizing: border-box; }

  html { color-scheme: light; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP",
      system-ui, -apple-system, "Segoe UI", sans-serif;
    font-feature-settings: "palt";
    -webkit-font-smoothing: antialiased;
    line-height: 1.8;
  }

  /* ═══ ヘッダー ═══ */
  .header {
    position: fixed;
    inset-inline: 0;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px clamp(20px, 4vw, 44px);
    background: rgba(251, 251, 248, 0.75);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(36, 38, 46, 0.06);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--fg);
  }
  .logo-mark {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    font-size: 0.86rem;
    font-weight: 800;
  }
  .logo-type { display: grid; line-height: 1.25; }
  .logo-type b { font-size: 0.86rem; font-weight: 800; letter-spacing: 0.06em; }
  .logo-type span { font-size: 0.56rem; letter-spacing: 0.28em; color: var(--muted); }
  .nav { display: flex; align-items: center; gap: clamp(14px, 2.4vw, 28px); }
  .nav a {
    color: var(--fg);
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-decoration: none;
    padding-bottom: 2px;
    border-bottom: 1.5px solid transparent;
    transition: color 0.2s, border-color 0.2s;
  }
  .nav a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .nav .pill {
    padding: 9px 20px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    border-bottom: none;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .nav .pill:hover { color: #fff; transform: translateY(-1px); box-shadow: 0 8px 20px var(--accent-soft); }
  .menu-btn { display: none; }

  /* ═══ ヒーロー ═══ */
  .hero {
    position: relative;
    isolation: isolate;
    min-height: 100svh;
    overflow: hidden;
    display: grid;
    place-items: center;
    padding: 100px clamp(20px, 5vw, 56px) 90px;
  }

  /* つくったものの壁。列は途切れず流れ続ける（上り・下り交互） */
  .wall {
    --wg: 30px; /* 列内の間隔。ループの継ぎ目計算に使うので変数で持つ */
    position: absolute;
    inset: -34% -22%;
    z-index: 1;
    display: flex;
    justify-content: center;
    gap: var(--wg);
    rotate: -7deg;
    pointer-events: none;
    will-change: transform;
  }
  .wcol {
    display: flex;
    flex-direction: column;
    gap: var(--wg);
    scale: var(--s, 1);
    /* 中身は同じ組を2セット。半分＋間隔ぶん動かすと継ぎ目なく一周する */
    animation: flowUp var(--t, 42s) linear infinite;
  }
  .wcol.down { animation-name: flowDown; }
  .wcol.far { filter: blur(1.7px); opacity: 0.72; }
  @keyframes flowUp {
    from { translate: 0 0; }
    to { translate: 0 calc(-50% - var(--wg) / 2); }
  }
  @keyframes flowDown {
    from { translate: 0 calc(-50% - var(--wg) / 2); }
    to { translate: 0 0; }
  }

  .site {
    width: clamp(280px, 24vw, 340px);
    flex: none;
    background: #fff;
    border: 1px solid var(--hairline);
    border-radius: 12px;
    box-shadow: var(--card-shadow);
    overflow: hidden;
    opacity: 0;
    translate: 0 28px;
  }
  .play .site {
    animation: cardIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: var(--fd, 0s);
  }
  @keyframes cardIn { to { opacity: 1; translate: 0 0; } }

  .site .bar {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 19px;
    padding: 0 10px;
    background: #f1efe9;
    border-bottom: 1px solid var(--hairline);
  }
  .site .bar i { width: 5px; height: 5px; border-radius: 50%; background: rgba(36, 38, 46, 0.18); }

  .mini { aspect-ratio: 16 / 12.5; display: flex; flex-direction: column; background: var(--tint); }
  .mini .mnav {
    flex: none;
    height: 15%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 9%;
    background: var(--main);
  }
  .mini .mnav em {
    font-style: normal;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.24em;
    color: #fff;
  }
  .mini .mnav i { width: 22px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.55); }
  .mini .mbody { flex: 1; display: flex; flex-direction: column; gap: 6%; padding: 8% 9%; }
  .mini.hero-t .mhero {
    flex: 1;
    border-radius: 5px;
    background: linear-gradient(135deg, var(--soft), var(--main));
    display: grid;
    place-items: center;
  }
  .mini.hero-t .chip { width: 52%; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.88); }
  .mini.hero-t .mrow { flex: none; display: flex; gap: 6%; height: 18%; }
  .mini.hero-t .mrow b { flex: 1; border-radius: 4px; background: var(--soft); }
  .mini.hero-t .mrow b.acc { background: var(--main); }
  .mini.grid-t .mgrid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 6%; }
  .mini.grid-t .mgrid b { border-radius: 5px; background: var(--soft); }
  .mini.grid-t .mgrid b:nth-child(2) { background: linear-gradient(135deg, var(--soft), var(--main)); }
  .mini.grid-t .mgrid b:nth-child(3) { background: var(--main); opacity: 0.75; }
  .mini.grid-t .mgrid b:nth-child(4) { background: var(--soft); opacity: 0.8; }
  .mini.circle-t .mbody { align-items: center; justify-content: center; }
  .mini.circle-t .mlogo {
    width: 34%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, var(--soft), var(--main));
  }
  .mini.circle-t .mname { width: 46%; height: 7px; border-radius: 4px; background: color-mix(in srgb, var(--main) 45%, #fff); }
  .mini.split-t .mbody { flex-direction: row; }
  .mini.split-t .mleft { flex: 1.1; border-radius: 5px; background: linear-gradient(160deg, var(--main), var(--soft)); }
  .mini.split-t .mright { flex: 1; display: flex; flex-direction: column; gap: 9%; justify-content: center; }
  .mini.split-t .mright s { display: block; height: 7px; border-radius: 4px; background: color-mix(in srgb, var(--main) 30%, #fff); }
  .mini.split-t .mright s:nth-child(2) { width: 82%; }
  .mini.split-t .mright s.btn { width: 58%; height: 11px; border-radius: 6px; background: var(--main); }

  /* 靄（もや）：壁の上に敷いて、中央の可読域を作る */
  .veil {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: radial-gradient(ellipse 72% 60% at 50% 47%,
      rgba(251, 251, 248, 0.96), rgba(251, 251, 248, 0.6) 55%, rgba(251, 251, 248, 0.06));
    pointer-events: none;
  }
  .hero-fade {
    position: absolute;
    inset-inline: 0;
    bottom: 0;
    height: 130px;
    z-index: 2;
    background: linear-gradient(to top, var(--bg), transparent);
    pointer-events: none;
  }

  /* 白箱 */
  .box {
    position: relative;
    z-index: 3;
    text-align: center;
    background: rgba(255, 255, 255, 0.86);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 24px 70px rgba(36, 38, 46, 0.13);
    border-radius: 16px;
    padding: clamp(30px, 5.5vh, 54px) clamp(26px, 5vw, 62px);
    max-width: 41rem;
    opacity: 0;
    translate: 0 22px;
  }
  .play .box { animation: boxIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.9s; }
  @keyframes boxIn { to { opacity: 1; translate: 0 0; } }

  .eyebrow {
    margin: 0 0 20px;
    color: var(--accent);
    font-size: 0.74rem;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 16px;
    font-size: clamp(2rem, 4.9vw, 3.3rem);
    font-weight: 800;
    line-height: 1.38;
    letter-spacing: 0.03em;
    text-wrap: balance;
  }
  h1 .q { color: var(--accent); }
  .lede {
    margin: 0 0 28px;
    color: var(--muted);
    font-size: clamp(0.9rem, 1.8vw, 0.98rem);
  }
  .lede span { display: inline-block; }
  .cta-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .cta {
    padding: 13px 28px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 700;
    text-decoration: none;
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s;
  }
  .cta-primary { background: var(--accent); color: #fff; box-shadow: 0 8px 24px var(--accent-soft); }
  .cta-secondary { border: 1px solid var(--hairline); color: var(--fg); background: #fff; }
  .cta:hover { transform: translateY(-2px); }
  .cta-primary:hover { box-shadow: 0 12px 32px rgba(196, 51, 62, 0.26); }
  .cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* 回るスクロール印（右下） */
  .stamp {
    position: absolute;
    right: clamp(18px, 4vw, 44px);
    bottom: 24px;
    z-index: 3;
    width: 72px;
    height: 72px;
    opacity: 0;
  }
  .play .stamp { animation: boxIn 1.2s ease forwards 2s; }
  .stamp svg { width: 100%; height: 100%; animation: spin 14s linear infinite; }
  @keyframes spin { to { rotate: 1turn; } }
  .stamp text {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.34em;
    fill: var(--muted);
    text-transform: uppercase;
  }
  .stamp .arrow { position: absolute; inset: 0; display: grid; place-items: center; color: var(--accent); }

  /* ═══ モバイル：縮小ではなく組み替え ═══ */
  @media (max-width: 760px) {
    .nav { display: none; }
    .menu-btn {
      display: grid;
      gap: 5px;
      padding: 12px 10px;
      border: none;
      background: transparent;
      cursor: pointer;
    }
    .menu-btn i { width: 22px; height: 2px; border-radius: 2px; background: var(--fg); }
    .hero { padding-top: 88px; padding-bottom: 100px; }
    .wall { --wg: 18px; inset: -34% -85%; rotate: -8deg; }
    .site { width: 210px; }
    .mini .mnav em { font-size: 8.5px; }
    .box { padding-inline: 22px; margin-inline: 2vw; }
    .cta { flex: 1 1 auto; text-align: center; padding: 14px 12px; }
    .stamp { width: 56px; height: 56px; bottom: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .wcol, .stamp svg { animation: none; }
    .site, .play .site, .box, .play .box, .stamp, .play .stamp {
      animation: none; opacity: 1; translate: 0 0;
    }
    .cta:hover, .nav .pill:hover { transform: none; }
  }
</style>

<header class="header">
  <a class="logo" href="#" aria-label="Santa Works トップ">
    <span class="logo-mark" aria-hidden="true">S</span>
    <span class="logo-type"><b>Santa Works</b><span>サンタワークス</span></span>
  </a>
  <nav class="nav" aria-label="グローバル">
    <a href="#">つくったもの</a>
    <a href="#">Web制作</a>
    <a href="#">Journal</a>
    <a href="#">About</a>
    <a class="pill" href="#">相談する</a>
  </nav>
  <button class="menu-btn" aria-label="メニュー"><i></i><i></i><i></i></button>
</header>

<section class="hero" id="hero">
  <div class="wall" id="wall" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>
  <div class="hero-fade" aria-hidden="true"></div>

  <div class="box">
    <p class="eyebrow">Santa Works — サンタワークス</p>
    <h1><span class="q">「</span>忘れたくない<span class="q">」</span>を、かたちに。</h1>
    <p class="lede">
      <span>記憶と思い出を、ITでサポートする個人事業です。</span><br />
      <span>後ろに流れているのは、実際につくってきたものたち。</span>
    </p>
    <div class="cta-row">
      <a class="cta cta-primary" href="#">相談する</a>
      <a class="cta cta-secondary" href="#">つくったものを見る</a>
    </div>
  </div>

  <div class="stamp" aria-hidden="true">
    <svg viewBox="0 0 100 100">
      <defs>
        <path id="stamppath" d="M 50,50 m -38,0 a 38,38 0 1,1 76,0 a 38,38 0 1,1 -76,0" />
      </defs>
      <text><textPath href="#stamppath">SCROLL — SCROLL — </textPath></text>
    </svg>
    <span class="arrow">↓</span>
  </div>
</section>

<script>
  (() => {
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const hero = document.getElementById("hero");
    const wall = document.getElementById("wall");

    /* 壁を組む。パレットは実在するデモ17本＋商品2本の業種から */
    const PALETTES = [
      { l: "KISSA",    m: "#7a5236", s: "#e8c9a8", t: "#faf3ea" },
      { l: "SALON",    m: "#d4899e", s: "#f3d3da", t: "#fdf4f6" },
      { l: "RAMEN",    m: "#b8433a", s: "#f2c063", t: "#fbf1e6" },
      { l: "NAIKA",    m: "#4e8f88", s: "#bfe0da", t: "#f0f7f6" },
      { l: "NAIL",     m: "#9a7fc9", s: "#ddd0f0", t: "#f7f4fb" },
      { l: "PHOTO",    m: "#3a3f52", s: "#b9c1d9", t: "#eef0f6" },
      { l: "FARM",     m: "#6f9a4e", s: "#d3e5bd", t: "#f4f8ee" },
      { l: "ITALIAN",  m: "#2f6e4f", s: "#e8b9ae", t: "#f6f3ec" },
      { l: "BARBER",   m: "#33518f", s: "#c6d3ec", t: "#f0f3f9" },
      { l: "PIANO",    m: "#3b3b47", s: "#cfc3e8", t: "#f3f1f8" },
      { l: "JUKU",     m: "#d97f2f", s: "#f5d9b8", t: "#fcf5ec" },
      { l: "IZAKAYA",  m: "#8f2f3a", s: "#e9c78f", t: "#f9f1e7" },
      { l: "CLUB",     m: "#2b2e3e", s: "#9fd8d2", t: "#eef4f4" },
      { l: "KOUMUTEN", m: "#a1622c", s: "#e5c79b", t: "#f9f3ea" },
      { l: "POKEMEMO", m: "#e0806b", s: "#ffd9c9", t: "#fff6f0" },
      { l: "EXIFSORT", m: "#4a6fa5", s: "#cfe0f2", t: "#f0f5fa" },
    ];
    const TYPES = ["hero-t", "grid-t", "circle-t", "split-t"];
    const BODY = {
      "hero-t": "<div class='mhero'><span class='chip'></span></div><div class='mrow'><b></b><b class='acc'></b></div>",
      "grid-t": "<div class='mgrid'><b></b><b></b><b></b><b></b></div>",
      "circle-t": "<span class='mlogo'></span><span class='mname'></span>",
      "split-t": "<div class='mleft'></div><div class='mright'><s></s><s></s><s class='btn'></s></div>",
    };
    const cols = 5, rows = 4;
    const depth = [0.92, 1, 1.08, 1, 0.92];
    let n = 0;
    for (let c = 0; c < cols; c++) {
      const col = document.createElement("div");
      col.className = "wcol" + (c % 2 ? " down" : "");
      // 流れの一周：36〜57秒。列ごとに速さを変えて機械的に見せない
      col.style.setProperty("--t", `${36 + (c % 4) * 7}s`);
      col.style.setProperty("--s", depth[c]);
      if (c === 0 || c === cols - 1) col.classList.add("far");
      for (let r = 0; r < rows; r++) {
        const p = PALETTES[n % PALETTES.length];
        const type = TYPES[(c * 2 + r * 3) % TYPES.length];
        const card = document.createElement("div");
        card.className = "site";
        card.style.setProperty("--main", p.m);
        card.style.setProperty("--soft", p.s);
        card.style.setProperty("--tint", p.t);
        card.style.setProperty("--fd", `${0.15 + ((c * rows + r) % 9) * 0.09}s`);
        card.innerHTML =
          "<div class='bar'><i></i><i></i><i></i></div>" +
          `<div class='mini ${type}'>` +
          `<div class='mnav'><em>${p.l}</em><i></i></div>` +
          `<div class='mbody'>${BODY[type]}</div></div>`;
        col.appendChild(card);
        n++;
      }
      // 同じ組をもう1セット足して、継ぎ目のないループにする
      col.innerHTML += col.innerHTML;
      wall.appendChild(col);
    }

    hero.classList.add("play");

    /* 壁がポインタに応える（±22px。流れと合わせて「生きている」感を出す） */
    if (!reduced) {
      let tx = 0, ty = 0, x = 0, y = 0, raf = 0;
      addEventListener("pointermove", (e) => {
        tx = (e.clientX / innerWidth - 0.5) * 44;
        ty = (e.clientY / innerHeight - 0.5) * 28;
        if (!raf) loop();
      });
      const loop = () => {
        x += (tx - x) * 0.055;
        y += (ty - y) * 0.055;
        wall.style.transform = `translate(${x}px, ${y}px)`;
        raf = Math.abs(tx - x) + Math.abs(ty - y) > 0.1 ? requestAnimationFrame(loop) : 0;
      };
    }
  })();
</script>
