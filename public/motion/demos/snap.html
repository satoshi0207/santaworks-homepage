<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スクロールスナップ｜動きの見本帳</title>
<script src="_lab.js?v=3" data-lab></script>
<link rel="stylesheet" href="_stage.css?v=2" data-lab>
<style>
:root {
  --bar: 56px; /* 上に固定したメニューの高さ */
  --pad: 56px; /* 止まる位置を、上からどれだけ下げるか。メニューの高さと同じにする */
}
/* 止まる位置の決まりなので、動きを減らす設定でもそのまま残す */
html {
  scroll-snap-type: y mandatory; /* 縦方向に、必ずどこかの区切りで止める */
  scroll-padding-top: var(--pad);
}
.bar { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); }
.slide {
  height: calc(100vh - var(--bar));
  scroll-snap-align: start; /* 区切りの上端で止まる */
}
</style>
<style data-lab>
.bar { z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 clamp(16px, 5vw, 48px); background: var(--surface); border-bottom: 1px solid var(--line); font-weight: 700; }
.bar small { font-size: 12px; color: var(--muted); font-weight: 400; }
main { padding-top: var(--bar); }
.slide { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 0 clamp(20px, 7vw, 80px); color: #2b2b33; overflow: hidden; }
.slide img { height: min(56vh, 300px); width: auto; max-width: 42vw; object-fit: contain; }
.slide .k { font-size: 14px; font-weight: 700; letter-spacing: 0.08em; }
.slide h2 { margin: 6px 0 0; font-size: clamp(28px, 7vw, 64px); white-space: nowrap; }
.slide p { margin: 10px 0 0; font-family: var(--mono); font-size: clamp(13px, 2.4vw, 18px); white-space: nowrap; }
.first { grid-template-columns: minmax(0, 1fr); align-content: center; color: var(--ink); }
.first img { height: auto; width: min(80%, 420px); max-width: none; }
.first p { font-family: inherit; color: var(--muted); white-space: normal; }
.sansu { background: #CDE9F7; } .sansu .k { color: var(--sansu); }
.kokugo { background: #FFC2D1; } .kokugo .k { color: var(--kokugo); }
.rika { background: #D5F0C4; } .rika .k { color: var(--rika); }
.shakai { background: #D6C7F5; } .shakai .k { color: var(--shakai); }
</style>
</head>
<body>
<header class="bar">まなリーフ 小4 <small>4人と、4教科</small></header>

<main>
  <section class="slide first">
    <span class="lab-hint" data-lab>DEMO · 下へスクロールしてください。手を離すと、1画面ずつぴたっと止まります</span>
    <img src="../media/logo-text.webp" width="900" height="325" alt="まなリーフ">
    <p>4年生の4教科を、1回10問で。</p>
  </section>
  <section class="slide sansu">
    <div><span class="k">アクアと学ぶ</span><h2>さんすう</h2><p>14単元・545問</p></div>
    <img src="../media/chara-aqua-cheering.webp" alt="">
  </section>
  <section class="slide kokugo" data-lab-more>
    <div><span class="k">リファと学ぶ</span><h2>こくご</h2><p>13単元・555問</p></div>
    <img src="../media/chara-rifa-cheering.webp" alt="">
  </section>
  <section class="slide rika" data-lab-more>
    <div><span class="k">ミンジュと学ぶ</span><h2>りか</h2><p>9単元・311問</p></div>
    <img src="../media/chara-minju-cheering.webp" alt="">
  </section>
  <section class="slide shakai" data-lab-more>
    <div><span class="k">キユと学ぶ</span><h2>しゃかい</h2><p>8単元・286問</p></div>
    <img src="../media/chara-kiyu-cheering.webp" alt="">
  </section>
</main>
</body>
</html>
