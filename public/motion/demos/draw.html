<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>線画アニメーション｜動きの見本帳</title>
<script src="_lab.js?v=3" data-lab></script>
<link rel="stylesheet" href="_stage.css?v=2" data-lab>
<style>
:root {
  --dur: 2.2s; /* 1本の線を描き切る時間 */
}

/* pathLength="1" にしておくと、どの線も長さ1として扱える。長さを測らなくてよい */
.line {
  fill: none;
  stroke-dasharray: 1;
  stroke-dashoffset: 0;
}

@media (prefers-reduced-motion: no-preference) {
  .line {
    stroke-dashoffset: 1; /* 線を「長さ1だけずらして」隠す */
    animation: draw var(--dur) ease-in-out forwards;
    animation-delay: calc(var(--d) * var(--dur)); /* --d は描き始めの順番（0〜1） */
  }
  .fill {
    opacity: 0;
    animation: show 0.8s ease forwards;
    animation-delay: calc(var(--dur) * 1.5);
  }
}

@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes show { to { opacity: 1; } }
</style>
<style data-lab>
body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
svg { width: min(56vw, 260px); height: auto; overflow: visible; }
.line { stroke: var(--rika); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.fill { fill: #D5F0C4; }
h1 { margin: 6px 0 0; font-size: clamp(24px, 5vw, 34px); letter-spacing: 0.08em; color: var(--rika); }
</style>
</head>
<body>
