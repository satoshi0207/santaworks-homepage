<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ハンバーガーメニュー｜動きの見本帳</title>
<script src="_lab.js?v=3" data-lab></script>
<link rel="stylesheet" href="_stage.css?v=2" data-lab>
<style>
:root {
  --dur: 0.3s; /* 変わるのにかける時間 */
}

/* 三本線。線と線の間は 8px なので、中心どうしは 12px 離れている */
.hamburger {
  display: inline-flex;
  flex-direction: column;
  gap: 8px;
}
.bar {
  display: block;
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: currentColor;
  transition: transform var(--dur) ease, opacity var(--dur) ease;
}

/* A：上下の線が真ん中に寄りながら回って、× になる */
.hb-spin[aria-expanded="true"] .bar:nth-child(1) { transform: translateY(12px) rotate(135deg); }
.hb-spin[aria-expanded="true"] .bar:nth-child(2) { opacity: 0; }
.hb-spin[aria-expanded="true"] .bar:nth-child(3) { transform: translateY(-12px) rotate(-135deg); }

/* B：真ん中が消え、上下が「寄る → 回る」の2段で × になる。
   translate と rotate を別々のプロパティにして、始まる時刻（delay）をずらす */
.hb-squeeze .bar {
  transition: rotate var(--dur) ease, translate var(--dur) ease var(--dur), scale var(--dur) ease; /* 閉じるとき：回りを戻してから離れる */
}
.hb-squeeze[aria-expanded="true"] .bar {
  transition: translate var(--dur) ease, rotate var(--dur) ease var(--dur), scale var(--dur) ease; /* 開くとき：寄ってから回る */
}
.hb-squeeze[aria-expanded="true"] .bar:nth-child(1) { translate: 0 12px; rotate: 45deg; }
.hb-squeeze[aria-expanded="true"] .bar:nth-child(2) { scale: 0 1; }
.hb-squeeze[aria-expanded="true"] .bar:nth-child(3) { translate: 0 -12px; rotate: -45deg; }

/* C：上下の線が短くなって左端で折れ、矢印（←）になる */
.hb-arrow .bar { transform-origin: left center; }
.hb-arrow[aria-expanded="true"] .bar:nth-child(1) { transform: translateY(12px) rotate(-45deg) scaleX(0.5); }
.hb-arrow[aria-expanded="true"] .bar:nth-child(3) { transform: translateY(-12px) rotate(45deg) scaleX(0.5); }

/* 動きを減らす設定では、パッと切り替える */
@media (prefers-reduced-motion: reduce) {
  .hamburger .bar { transition: none !important; }
}
</style>
<style data-lab>
body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px 16px; text-align: center; }
.row { display: flex; justify-content: center; gap: clamp(14px, 5vw, 40px); }
.item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.hamburger { align-items: center; justify-content: center; width: 76px; height: 76px; padding: 0; border: 1.5px solid var(--line); border-radius: 18px; background: var(--surface); cursor: pointer; box-shadow: 0 6px 16px rgba(36, 38, 46, 0.08); }
.hamburger:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.hb-spin { color: var(--sansu); } .hb-squeeze { color: var(--kokugo); } .hb-arrow { color: var(--rika); }
.cap { font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.5; }
.state { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.state::before { content: "aria-expanded"; display: block; opacity: 0.7; }
.all { font: inherit; font-size: 13px; padding: 8px 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chara { height: clamp(90px, 22vh, 160px); width: auto; }
</style>
</head>
<body>
<span class="lab-hint" data-lab>DEMO · ボタンを押すたびに、三本線と × が行き来します</span>
<img class="chara" src="../media/fairy-kira-normal.webp" width="290" height="292" alt="" data-lab>
<div class="row">
  <div class="item">
    <button class="hamburger hb-spin" type="button" aria-label="メニュー" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
    <span class="cap" data-lab>A 回って ×</span>
    <span class="state" data-lab>false</span>
  </div>
  <div class="item">
    <button class="hamburger hb-squeeze" type="button" aria-label="メニュー" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
    <span class="cap" data-lab>B 寄ってから ×</span>
    <span class="state" data-lab>false</span>
  </div>
  <div class="item" data-lab-more>
    <button class="hamburger hb-arrow" type="button" aria-label="メニュー" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
    <span class="cap">C 矢印 ←</span>
    <span class="state">false</span>
  </div>
</div>
<button class="all" type="button" data-lab>3つ同時に押す</button>

<script>
// 開いているかどうかは aria-expanded だけに持たせる。見た目は CSS がこれを見て変える
for (const btn of document.querySelectorAll('.hamburger')) {
  btn.addEventListener('click', () => {
    const open = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', String(!open));
  });
}
</script>
<script data-lab>
  // 見本帳専用：状態の表示と「3つ同時に押す」
  for (const btn of document.querySelectorAll('.hamburger')) {
    btn.addEventListener('click', () => {
      btn.parentElement.querySelector('.state').textContent = btn.getAttribute('aria-expanded');
    });
  }
  document.querySelector('.all').addEventListener('click', () => {
    document.querySelectorAll('.hamburger').forEach((b) => b.click());
  });
</script>
</body>
</html>
