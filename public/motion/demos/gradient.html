<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メッシュグラデーション｜動きの見本帳</title>
<script src="_lab.js?v=3" data-lab></script>
<link rel="stylesheet" href="_stage.css?v=2" data-lab>
<style>
html, body { height: 100%; margin: 0; }
canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}
</style>
<style data-lab>
body { overflow: hidden; }
.over { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
.over img { width: min(70vw, 420px); height: auto; filter: drop-shadow(0 6px 18px rgba(80, 60, 120, 0.25)); }
.over p { margin: 0; color: #4a4a4a; font-weight: 700; }
</style>
</head>
<body>
<canvas data-speed="0.4" data-blend="3"></canvas>
<div class="over" data-lab>
  <img src="../media/logo-text.webp" alt="まなリーフ">
  <p>4年生の4教科を、1回10問で。</p>
</div>

<script>
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl');
const reduce = matchMedia('(prefers-reduced-motion: reduce)');

// 色を決める処理。5つの色の点が動き回り、近い点の色ほど強く混ざる
const fragment = `
  precision mediump float;
  uniform vec2 uSize;
  uniform float uTime, uBlend;
  const vec3 C0 = vec3(0.804, 0.914, 0.969); // 水色
  const vec3 C1 = vec3(1.000, 0.761, 0.820); // ピンク
  const vec3 C2 = vec3(0.835, 0.941, 0.769); // 若葉
  const vec3 C3 = vec3(0.839, 0.780, 0.961); // ラベンダー
  const vec3 C4 = vec3(1.000, 0.953, 0.690); // 黄色
  vec2 spot(float i) {
    return vec2(0.5 + 0.38 * sin(uTime * (0.6 + i * 0.13) + i * 1.7),
                0.5 + 0.38 * cos(uTime * (0.5 + i * 0.11) + i * 2.3));
  }
  void main() {
    vec2 p = gl_FragCoord.xy / uSize;
    vec3 sum = vec3(0.0);
    float total = 0.0;
    vec3 colors[5];
    colors[0] = C0; colors[1] = C1; colors[2] = C2; colors[3] = C3; colors[4] = C4;
    for (int i = 0; i < 5; i++) {
      float w = 1.0 / pow(distance(p, spot(float(i))) + 0.05, uBlend); // 近いほど重い
      sum += colors[i] * w;
      total += w;
    }
    gl_FragColor = vec4(sum / total, 1.0);
  }
`;
const vertex = `
  attribute vec2 position;
  void main() { gl_Position = vec4(position, 0.0, 1.0); }
`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  return shader;
}
const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(program);
gl.useProgram(program);

// 画面をおおう三角形を1枚だけ描く
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uSize = gl.getUniformLocation(program, 'uSize');
const uTime = gl.getUniformLocation(program, 'uTime');
const uBlend = gl.getUniformLocation(program, 'uBlend');

let t = 0;
let last = performance.now();
function frame(now) {
  // 背景なので解像度は半分で十分。軽さを優先する
  const w = Math.round(canvas.clientWidth / 2);
  const h = Math.round(canvas.clientHeight / 2);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
  if (!reduce.matches) t += ((now - last) / 1000) * Number(canvas.dataset.speed);
  last = now;
  gl.uniform2f(uSize, w, h);
  gl.uniform1f(uTime, t);
  gl.uniform1f(uBlend, Number(canvas.dataset.blend));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
