<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>テキストアニメーション｜動きの見本帳</title>
<script src="_lab.js?v=3" data-lab></script>
<link rel="stylesheet" href="_stage.css?v=2" data-lab>
<style>
:root {
  --stagger: 70ms; /* 1文字ごとの遅れ */
  --dur: 0.6s;     /* 1文字が出きるまでの時間 */
}

.split span {
  display: inline-block; /* transform は inline 要素には効かない */
}

/* 動きは「減らす設定ではない人」にだけ付ける。何もしなければ、最初から見えている */
@media (prefers-reduced-motion: no-preference) {
  .split span {
    animation: pop var(--dur) cubic-bezier(0.2, 0.9, 0.3, 1.3) both;
    animation-delay: calc(var(--i) * var(--stagger));
  }
}

@keyframes pop {
  from { opacity: 0; transform: translateY(0.6em) scale(0.6); }
  to   { opacity: 1; transform: none; }
}
</style>
<style data-lab>
body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
.split { margin: 14px 0 0; font-size: clamp(48px, 13vw, 112px); font-weight: 800; letter-spacing: 0.04em; line-height: 1.2; }
.split span:nth-child(1) { color: var(--kokugo); }
.split span:nth-child(2) { color: #F08A24; }
.split span:nth-child(3) { color: var(--sansu); }
.split span:nth-child(4) { color: var(--rika); }
.split span:nth-child(5) { color: var(--shakai); }
.sub { margin: 18px 0 0; font-size: clamp(15px, 2.4vw, 19px); color: var(--muted); }
.row { display: flex; gap: 8px; margin-top: 28px; }
.row img { height: clamp(90px, 20vh, 140px); width: auto; }
</style>
</head>
<body>
<span class="lab-hint" data-lab>DEMO · 「↻ 最初から」で見直せます</span>
<!-- 読み上げソフトが1文字ずつ読まないよう、まとまりの読みを aria-label で渡す -->
<h1 class="split" aria-label="まなリーフ">
  <span style="--i: 0" aria-hidden="true">ま</span><span style="--i: 1" aria-hidden="true">な</span><span style="--i: 2" aria-hidden="true">リ</span><span style="--i: 3" aria-hidden="true">ー</span><span style="--i: 4" aria-hidden="true">フ</span>
</h1>
<p class="sub">4年生の4教科を、1回10問で。</p>
<div class="row" data-lab>
  <img src="../media/chara-aqua-smile.webp" alt="">
  <img src="../media/chara-rifa-smile.webp" alt="">
  <img src="../media/chara-minju-smile.webp" alt="">
  <img src="../media/chara-kiyu-smile.webp" alt="">
</div>
</body>
</html>
