<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>モーフィング｜動きの見本帳</title>
<script src="_lab.js?v=3" data-lab></script>
<link rel="stylesheet" href="_stage.css?v=2" data-lab>
<style>
:root {
  --speed: 8s; /* 1周の秒数 */
}
.blob {
  position: absolute;
  inset: 0;
  background: color-mix(in srgb, var(--sansu) 45%, var(--bg)); /* 半透明で重ねると、重なりが濁る。淡い色を不透明で重ねる */
  /* 8つの値：左上・右上・右下・左下の「横の丸み」 / 同じ順の「縦の丸み」 */
  border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
  animation: morph var(--speed) ease-in-out infinite, turn calc(var(--speed) * 3) linear infinite;
}
/* 重ねた丸は、始まる時点をずらして、同じ形にそろわないようにする */
.blob:nth-child(2) {
  animation-delay: calc(var(--speed) * -0.33), calc(var(--speed) * -1);
  animation-direction: reverse;
}
.blob:nth-child(3) {
  animation-delay: calc(var(--speed) * -0.66), calc(var(--speed) * -2);
}

@keyframes morph {
  0%, 100% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; }
  25%      { border-radius: 70% 30% 46% 54% / 30% 29% 71% 70%; }
  50%      { border-radius: 30% 70% 30% 70% / 62% 70% 30% 38%; }
  75%      { border-radius: 58% 42% 75% 25% / 76% 46% 54% 24%; }
}
/* ゆっくり回すと、形の変わり方が単調に見えない */
@keyframes turn {
  to { rotate: 360deg; }
}

@media (prefers-reduced-motion: reduce) {
  .blob { animation: none; }
}
</style>
<style data-lab>
body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px 16px; overflow: hidden; text-align: center; }
.hero { position: relative; width: min(80vw, 360px); aspect-ratio: 1; }
.blobs { position: absolute; inset: 0; }
.blob.kokugo { background: color-mix(in srgb, var(--kokugo) 45%, var(--bg)); inset: 10% -2% 2% 12%; }
.blob.rika { background: color-mix(in srgb, var(--rika) 45%, var(--bg)); inset: 22% 18% 12% 20%; }
.hero > img { position: absolute; left: 50%; bottom: 0; translate: -50% 0; height: 100%; width: auto; filter: drop-shadow(0 10px 16px rgba(20, 22, 30, 0.25)); }
.caption { margin: 0; }
.caption b { display: block; font-size: clamp(20px, 4.4vw, 26px); letter-spacing: 0.06em; }
.caption small { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<span class="lab-hint" data-lab>DEMO · 後ろの丸が、ゆっくり形を変えます</span>
<div class="hero">
  <div class="blobs">
    <div class="blob sansu"></div>
    <div class="blob kokugo"></div>
    <div class="blob rika" data-lab-more></div>
  </div>
  <img src="../media/chara-aqua-cheering.webp" width="323" height="480" alt="アクア">
</div>
<p class="caption" data-lab><b>アクアと、さんすう</b><small>14単元・545問</small></p>
</body>
</html>
