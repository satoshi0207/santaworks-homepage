<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マウスパララックス｜動きの見本帳</title>
<script src="_lab.js?v=3" data-lab></script>
<link rel="stylesheet" href="_stage.css?v=2" data-lab>
<style>
.scene {
  position: relative;
  height: 100vh;
  overflow: hidden;
}
.layer {
  position: absolute;
  inset: -50px; /* ずれた分の隙間が見えないよう、四方に大きめにとる */
  will-change: transform;
}

@media (prefers-reduced-motion: reduce) {
  .layer { transform: none !important; }
}
</style>
<style data-lab>
body { overflow: hidden; }
.far img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 62% 50%; }
.mid { display: flex; align-items: flex-end; justify-content: center; gap: clamp(0px, 1.5vw, 18px); }
.mid img { width: min(21%, 190px); height: auto; margin-bottom: 26px; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.3)); }
.near { pointer-events: none; }
.near img { position: absolute; right: calc(50px + 8%); top: calc(50px + 22%); width: clamp(80px, 20vw, 150px); height: auto; filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.35)); }
.copy { position: absolute; left: 0; right: 0; top: 0; padding: clamp(18px, 6vh, 44px) clamp(20px, 6vw, 64px) 0; color: #fff; text-shadow: 0 2px 14px rgba(10, 16, 40, 0.7); pointer-events: none; }
.copy .lab-hint { color: rgba(255, 255, 255, 0.85); }
.copy h1 { margin: 8px 0 0; font-size: clamp(28px, 6vw, 48px); letter-spacing: 0.06em; }
.copy p { margin: 8px 0 0; font-size: clamp(13px, 2vw, 17px); }
</style>
</head>
<body>
<section class="scene" data-strength="1">
  <!-- 係数（data-depth）が大きい層ほど大きくずれる＝手前に見える -->
  <div class="layer far" data-depth="20">
    <img src="../media/hero-grade4.webp" width="1536" height="1024" alt="">
  </div>
  <div class="layer mid" data-depth="50">
    <img src="../media/chara-aqua-cheering.webp" width="323" height="480" alt="アクア">
    <img src="../media/chara-rifa-cheering.webp" width="290" height="480" alt="リファ">
    <img src="../media/chara-minju-cheering.webp" width="290" height="480" alt="ミンジュ" data-lab-more>
    <img src="../media/chara-kiyu-cheering.webp" width="267" height="480" alt="キユ" data-lab-more>
  </div>
  <div class="layer near" data-depth="120">
    <img src="../media/fairy-kira-happy.webp" width="290" height="292" alt="キラ">
  </div>
  <div class="copy" data-lab>
    <span class="lab-hint">DEMO · 枠の中でマウスを動かしてください（スマホでは動きません）</span>
    <h1>まなリーフ 小4</h1>
    <p>4人と、4教科をめぐる。</p>
  </div>
</section>

<script>
const scene = document.querySelector('.scene');
const layers = [...document.querySelectorAll('.layer')];
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const target = { x: 0, y: 0 };  // カーソルの、中心からのずれ（-0.5 〜 0.5）
const current = { x: 0, y: 0 }; // なめらかに追いかける値

scene.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse') return; // 指では動かさない
  const r = scene.getBoundingClientRect();
  target.x = (e.clientX - r.left) / r.width - 0.5;
  target.y = (e.clientY - r.top) / r.height - 0.5;
});
// 枠から出たら、中心へゆっくり戻す
scene.addEventListener('pointerleave', () => {
  target.x = 0;
  target.y = 0;
});

function tick() {
  current.x += (target.x - current.x) * 0.08;
  current.y += (target.y - current.y) * 0.08;
  const strength = reduce.matches ? 0 : Number(scene.dataset.strength); // 全体の強さ
  for (const el of layers) {
    const depth = Number(el.dataset.depth) * strength; // 層ごとの係数（端まで動かしたときのずれ。px）
    el.style.transform = `translate3d(${-current.x * depth}px, ${-current.y * depth}px, 0)`;
  }
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
