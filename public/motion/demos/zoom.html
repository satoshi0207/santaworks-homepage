<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ズームスクロール｜動きの見本帳</title>
<script src="_lab.js?v=3" data-lab></script>
<link rel="stylesheet" href="_stage.css?v=2" data-lab>
<style>
:root {
  --len: 300vh; /* 区間の長さ。長いほどゆっくり広がる */
  --from: 0.35; /* 始めの大きさ（画面いっぱいを 1 とした割合） */
}
.zoom-sticky { position: sticky; top: 0; height: 100vh; overflow: hidden; }
.zoom-frame { position: absolute; inset: 0; }
.zoom-frame img { width: 100%; height: 100%; object-fit: cover; }

/* 何もしなければ、広がった状態で見える。対応していて、動きを減らす設定でないときだけ動かす */
@supports (animation-timeline: view()) {
  @media (prefers-reduced-motion: no-preference) {
    .zoom { height: var(--len); view-timeline-name: --zoom; }
    .zoom-frame {
      animation: grow linear both;
      animation-timeline: --zoom;
      animation-range: contain 0% contain 60%; /* 区間の前半で、画面いっぱいまで広がる */
    }
    .zoom-text {
      animation: show linear both;
      animation-timeline: --zoom;
      animation-range: contain 65% contain 85%; /* 広がりきってから、文字が重なる */
    }
  }
}

@keyframes grow {
  from { transform: scale(var(--from)); border-radius: 28px; }
  to   { transform: none; border-radius: 0; }
}
@keyframes show {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: none; }
}
</style>
<style data-lab>
.intro, .outro { min-height: 55vh; display: flex; flex-direction: column; justify-content: center; padding: 0 clamp(24px, 6vw, 72px); }
.intro h1 { margin: 10px 0 0; font-size: clamp(26px, 5vw, 40px); }
.outro { color: var(--muted); }
.lab-unsupported { display: none; margin: 14px 0 0; color: var(--kokugo); font-weight: 700; }
@supports not (animation-timeline: view()) { .lab-unsupported { display: block; } }
.zoom-frame { overflow: hidden; box-shadow: 0 18px 40px rgba(20, 22, 40, 0.3); }
.zoom-frame img { display: block; }
.zoom-text { position: absolute; left: 0; right: 0; bottom: 0; padding: 18vh clamp(20px, 6vw, 72px) clamp(28px, 8vh, 64px); background: linear-gradient(transparent, rgba(10, 14, 40, 0.55)); color: #fff; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6); }
.zoom-text p { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.1em; }
.zoom-text h2 { margin: 8px 0 0; font-size: clamp(26px, 6vw, 48px); line-height: 1.3; }
</style>
</head>
<body>
<header class="intro" data-lab>
  <span class="lab-hint">DEMO · 下へスクロールしてください</span>
  <h1>小さな窓が、画面いっぱいに広がる</h1>
  <p class="lab-unsupported">このブラウザは animation-timeline に未対応のため、広がった状態で表示されています（Chrome・Edge・Safari 26 以降で動きます）</p>
</header>

<section class="zoom">
  <div class="zoom-sticky">
    <div class="zoom-frame">
      <img src="../media/hero-grade4.webp" width="1536" height="1024" alt="星空と大きな木の風景">
    </div>
    <div class="zoom-text">
      <p>まなリーフ 小4</p>
      <h2>4年生の4教科を、<br>1回10問で。</h2>
    </div>
  </div>
</section>

<p class="outro" data-lab>ここでズームの区間が終わります。</p>
</body>
</html>
