<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スライダー（CSSだけ）｜動きの見本帳</title>
<script src="_lab.js?v=3" data-lab></script>
<link rel="stylesheet" href="_stage.css?v=2" data-lab>
<style>
:root {
  --w: 240px; /* 1枚の幅。次の写真が少し見えていると、横に送れると気づきやすい */
}
.slider {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;  /* 指を離すと、いちばん近い1枚の位置に吸い付く */
  scroll-padding-inline: 24px;    /* 吸い付く位置を、左の余白のぶんだけ内側にする */
  padding-inline: 24px;
  overscroll-behavior-x: contain; /* 端まで送っても、ブラウザの「戻る」に伝えない */
}
.slide {
  flex: 0 0 var(--w); /* 縮ませない */
  scroll-snap-align: start;
}

/* キーボードで送るときだけ、なめらかに流す */
@media (prefers-reduced-motion: no-preference) {
  .slider { scroll-behavior: smooth; }
}
</style>
<style data-lab>
body { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 16px 0; overflow-x: hidden; }
.head { padding: 0 24px; }
.head h1 { margin: 6px 0 0; font-size: clamp(20px, 4vw, 26px); }
.slider { padding-block: 4px 14px; scrollbar-width: thin; }
.slider:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.slide { margin: 0; }
.slide img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 14px; box-shadow: 0 10px 26px rgba(20, 22, 40, 0.18); }
.slide.chara img { object-fit: contain; object-position: center bottom; padding-top: 12px; }
.slide figcaption { margin-top: 8px; font-size: 13px; font-weight: 700; }
.slide figcaption small { display: block; font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--muted); }
.sansu img { background: #CDE9F7; } .kokugo img { background: #FFC2D1; } .rika img { background: #D5F0C4; } .shakai img { background: #D6C7F5; }
</style>
</head>
<body>
<div class="head" data-lab>
  <span class="lab-hint">DEMO · 写真を指やトラックパッドで横に送ってください（矢印・自動送りはありません。マウスは Shift＋ホイールかスクロールバー）</span>
  <h1>4人のおはなしと、4つの教科</h1>
</div>

<div class="slider" tabindex="0" aria-label="おはなしと教科の写真">
  <figure class="slide"><img src="../media/story-aqua-1.webp" width="720" height="1080" alt="アクアのおはなしのさし絵"><figcaption>アクアのおはなし<small>第1章</small></figcaption></figure>
  <figure class="slide"><img src="../media/story-rifa-1.webp" width="720" height="1080" alt="リファのおはなしのさし絵"><figcaption>リファのおはなし<small>第1章</small></figcaption></figure>
  <figure class="slide" data-lab-more><img src="../media/story-minju-1.webp" width="720" height="1080" alt="ミンジュのおはなしのさし絵"><figcaption>ミンジュのおはなし<small>第1章</small></figcaption></figure>
  <figure class="slide" data-lab-more><img src="../media/story-kiyu-1.webp" width="720" height="1080" alt="キユのおはなしのさし絵"><figcaption>キユのおはなし<small>第1章</small></figcaption></figure>
  <figure class="slide chara sansu" data-lab-more><img src="../media/chara-aqua-smile.webp" width="339" height="476" alt="アクア"><figcaption>アクアと、さんすう<small>14単元・545問</small></figcaption></figure>
  <figure class="slide chara kokugo" data-lab-more><img src="../media/chara-rifa-smile.webp" width="254" height="474" alt="リファ"><figcaption>リファと、こくご<small>13単元・555問</small></figcaption></figure>
  <figure class="slide chara rika" data-lab-more><img src="../media/chara-minju-smile.webp" width="259" height="480" alt="ミンジュ"><figcaption>ミンジュと、りか<small>9単元・311問</small></figcaption></figure>
  <figure class="slide chara shakai" data-lab-more><img src="../media/chara-kiyu-smile.webp" width="309" height="480" alt="キユ"><figcaption>キユと、しゃかい<small>8単元・286問</small></figcaption></figure>
</div>
</body>
</html>
