<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lottie｜動きの見本帳</title>
<script src="_lab.js?v=3" data-lab></script>
<link rel="stylesheet" href="_stage.css?v=2" data-lab>
<style>
#stage {
  width: min(80vw, 360px);
  aspect-ratio: 1;
}
</style>
<style data-lab>
body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px; text-align: center; }
.name { margin: 0; font-weight: 700; }
</style>
</head>
<body>
<span class="lab-hint" data-lab>DEMO · 妖精キラが、はね続けます</span>
<div id="stage" data-speed="1"></div>
<p class="name" data-lab>キラ</p>

<script src="https://cdn.jsdelivr.net/npm/lottie-web@5.13.0/build/player/lottie_light.min.js"></script>
<script>
const stage = document.getElementById('stage');
const reduce = matchMedia('(prefers-reduced-motion: reduce)');

const anim = lottie.loadAnimation({
  container: stage,
  renderer: 'svg',
  loop: true,
  autoplay: !reduce.matches, // 動きを減らす設定なら、最初のコマで止めておく
  path: 'fairy-bounce.json', // ふつうはデザインツール（After Effects など）から書き出したデータ
});
anim.setSpeed(Number(stage.dataset.speed)); // 1が書き出したときの速さ
</script>
</body>
</html>
