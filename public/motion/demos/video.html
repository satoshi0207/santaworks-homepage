<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スクロール連動動画｜動きの見本帳</title>
<script src="_lab.js?v=3" data-lab></script>
<link rel="stylesheet" href="_stage.css?v=2" data-lab>
<style>
:root {
  --len: 400vh; /* コマ送りに使うスクロールの長さ。長いほどゆっくり進む */
}
.scrub {
  height: var(--len);
}
.screen {
  position: sticky;
  top: 0;
  height: 100vh;
}

@media (prefers-reduced-motion: reduce) {
  .scrub { height: auto; } /* コマ送りせず、1枚の絵として見せる */
}
</style>
<style data-lab>
.intro, .outro { min-height: 50vh; display: flex; flex-direction: column; justify-content: center; padding: 0 clamp(24px, 6vw, 72px); }
.intro h1 { margin: 10px 0 0; font-size: clamp(24px, 5vw, 38px); }
.intro p, .outro { color: var(--muted); }
.screen { display: grid; place-items: center; }
.phone { padding: 10px; border-radius: 34px; background: #1d1f27; box-shadow: 0 20px 50px rgba(20, 22, 40, 0.35); }
canvas { display: block; height: min(80vh, 560px); width: auto; aspect-ratio: 300 / 652; border-radius: 26px; background: #fff; }
.meter { position: absolute; right: clamp(16px, 4vw, 40px); bottom: 24px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header class="intro" data-lab>
  <span class="lab-hint">DEMO · 下へスクロールしてください</span>
  <h1>まなリーフ 小3 を、指で進める</h1>
  <p>スクロールの量に合わせて、アプリの画面録画が1コマずつ進みます。</p>
</header>

<section class="scrub">
  <div class="screen">
    <div class="phone">
      <canvas width="300" height="652"></canvas>
    </div>
    <span class="meter" data-lab></span>
  </div>
</section>

<p class="outro" data-lab>ここで動画の区間が終わります。</p>

<script>
const scene = document.querySelector('.scrub');
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)');

// 動画を1コマずつの画像にしておき、先に全部読み込む
const COUNT = 60;
const frames = Array.from({ length: COUNT }, (_, i) => {
  const img = new Image();
  img.src = `../media/scrub/f${String(i + 1).padStart(3, '0')}.webp`;
  return img;
});

let shown = -1;
function draw() {
  const r = scene.getBoundingClientRect();
  const progress = Math.min(Math.max(-r.top / (r.height - innerHeight), 0), 1); // 区間の中で 0〜1
  const i = reduce.matches ? 0 : Math.round(progress * (COUNT - 1));
  if (i !== shown && frames[i].complete) {
    ctx.drawImage(frames[i], 0, 0, canvas.width, canvas.height);
    shown = i;
  }
  requestAnimationFrame(draw);
}
draw();
</script>
<script data-lab>
  const meter = document.querySelector('.meter');
  (function loop() { meter.textContent = `${Math.max(shown, 0) + 1} / ${COUNT} コマ`; requestAnimationFrame(loop); })();
</script>
</body>
</html>
