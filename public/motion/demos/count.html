<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カウントアップ｜動きの見本帳</title>
<script src="_lab.js?v=3" data-lab></script>
<link rel="stylesheet" href="_stage.css?v=2" data-lab>
<style>
.num {
  font-variant-numeric: tabular-nums; /* 数字の幅をそろえ、数えている間に横にずれないようにする */
}
</style>
<style data-lab>
.top { min-height: 92vh; display: flex; flex-direction: column; justify-content: center; padding: 0 clamp(24px, 6vw, 72px); }
.top h1 { margin: 10px 0 0; font-size: clamp(28px, 5.5vw, 44px); letter-spacing: 0.04em; }
.top p { margin: 12px 0 0; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(12px, 2.4vw, 20px); max-width: 640px; margin: 0 auto; padding: 0 clamp(16px, 6vw, 72px) 20vh; box-sizing: content-box; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: clamp(16px, 3vw, 24px) clamp(16px, 3vw, 26px); }
.stat dt { font-size: 13px; color: var(--muted); }
.stat dd { margin: 6px 0 0; font-size: clamp(26px, 7vw, 52px); font-weight: 800; letter-spacing: 0.02em; line-height: 1.1; white-space: nowrap; }
.stat dd small { font-size: clamp(13px, 2.4vw, 16px); font-weight: 700; margin-left: 4px; color: var(--muted); }
.stat:nth-child(1) dd { color: var(--sansu); }
.stat:nth-child(2) dd { color: var(--kokugo); }
.stat:nth-child(3) dd { color: var(--rika); }
.stat:nth-child(4) dd { color: var(--shakai); }
</style>
</head>
<body>
<header class="top" data-lab>
  <span class="lab-hint">DEMO · 下へスクロールしてください</span>
  <h1>まなリーフ 小4 に入っているもの</h1>
  <p>数字が画面に入ると、0から数え上がります。</p>
</header>

<!-- 最終の値は HTML に書いておく。JS が動かなくても、正しい数字が見える -->
<dl class="stats" data-dur="1600">
  <div class="stat"><dt>4教科の単元</dt><dd><span class="num" data-to="44">44</span><small>単元</small></dd></div>
  <div class="stat"><dt>ぜんぶの問題</dt><dd><span class="num" data-to="1697">1,697</span><small>問</small></dd></div>
  <div class="stat" data-lab-more><dt>4人のおはなし</dt><dd><span class="num" data-to="24">24</span><small>章</small></dd></div>
  <div class="stat" data-lab-more><dt>集めるかべがみ</dt><dd><span class="num" data-to="23">23</span><small>枚</small></dd></div>
</dl>

<script>
const stats = document.querySelector('.stats');
const reduce = matchMedia('(prefers-reduced-motion: reduce)');

function countUp(el) {
  const to = Number(el.dataset.to);
  if (reduce.matches) return; // HTML の最終値のまま
  const dur = Number(stats.dataset.dur); // 数え終わるまでのミリ秒
  const start = performance.now();
  function step(now) {
    const t = Math.min((now - start) / dur, 1);
    const eased = 1 - Math.pow(1 - t, 3); // 最後にゆっくり止まる
    el.textContent = Math.round(to * eased).toLocaleString('ja-JP');
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

const io = new IntersectionObserver((entries) => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    countUp(entry.target);
    io.unobserve(entry.target);
  }
}, { threshold: 0.6 });

document.querySelectorAll('.num').forEach((el) => {
  if (!reduce.matches) el.textContent = '0'; // JS が動くときだけ 0 から始める
  io.observe(el);
});
</script>
</body>
</html>
